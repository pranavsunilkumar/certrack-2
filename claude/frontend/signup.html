<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certificates HQ – Sign Up</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
<div class="page">
    <div class="bg-anime" aria-hidden="true">
      <div class="stars"></div>
      <div class="petals"></div>
    </div>
    <div class="main">
      <div class="card anime-card">
<div class="card-icon anime-pop"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M720-400v-120H600v-80h120v-120h80v120h120v80H800v120h-80Zm-360-80q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm80-80h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T440-640q0-33-23.5-56.5T360-720q-33 0-56.5 23.5T280-640q0 33 23.5 56.5T360-560Zm0-80Zm0 400Z"/></svg></div>
        <div class="logo-upload">
          <label class="logo-label" for="logo-input">Logo (optional)</label>
          <input id="logo-input" type="file" accept="image/*" class="logo-input" />
          <div id="logo-preview" class="logo-preview" aria-hidden="true"></div>
        </div>
        <h1 class="anime-text">Create Account</h1>
        <p class="subtitle anime-text">Join Certificates HQ</p>

        <form id="signup-form">
          <div class="field">
            <span>Full Name</span>
            <input type="text" name="name" required />
          </div>
          <div class="field">
            <span>Email</span>
            <input type="email" name="email" required />
          </div>
          <div class="field">
            <span>Password</span>
            <input type="password" name="password" required />
          </div>
          <div class="field">
            <span>I am a</span>
            <select id="signup-role" style="width:100%;padding:10px;border-radius:10px;border:1px solid #f6f2f5;">
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
              <option value="admin">Admin</option>
            </select>
          </div>
<button type="submit" class="primary-btn anime-btn">Sign Up</button>
        </form>

        <p class="small-text">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="auth-logo.js"></script>
</body>
</html>
